<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collide</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body{
        background: #101010 url("https://naayrlee.github.io/Song/colli.jpg") no-repeat center center fixed;
        background-size: contain;
        color: white;
        font-family: monospace;
        text-align: center;
        padding: 24px;
        }
        h1{color: #ee2049;}
        button{
        padding: 12px 25px;
        background: #ee2049;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        }
        #lyrics {
        margin-top: 40px;
        font-size: 24px;
        min-height: 60px;
        font-family: 'Mali', cursive;
    }
        .fade{animation:fadeIn 1s;}
        @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
        .heart {
            position: fixed;
            bottom: -30px;
            color: #ee2049;
            opacity: 0.5;
            animation: floatUp 6s linear forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            to {transform: translateY(-110vh); opacity: 0;}
        }
    </style>
</head>

<body>
    <h1>Song For You ♡</h1>
    <p>I feel...</p>
    <button id="PlayButton">Play</button>
    <audio id="Song" src="https://naayrlee.github.io/Song/songcollide.mp4.mp4"></audio>
    <div id="lyrics"></div>
    <script>
        const song = document.getElementById("Song");
        const button = document.getElementById("PlayButton");
        const lyricsBox = document.getElementById("lyrics");
        const lyrics = [
            { time: 0.5, text: "I know that this is love" },
            { time: 2.5, text: "when we touch, boy" },
            { time: 4.5, text: "You got my hearttttt" },
            { time: 7.5, text: "And can't nobody" },
            { time: 9.0, text: "make me feel like you do" },
            { time: 11.5, text: "boy, like you do" },
            { time: 14.5, text: "Ooooh..." },
            { time: 20.5, text: "Ooooh..." },
            { time: 26.5, text: "'Cause baby, we can go" },
            { time: 28.5, text: "We can go overtime" },
            { time: 31.5, text: "We can move fast," },
            { time: 33.0, text: "then rewind" },
            { time: 34.5, text: "When you put your body" },
            { time: 36.5, text: "on mine" },
            { time: 38.0, text: "And collide, collide" },
            { time: 41.5, text: "It could be one of those nights" },
            { time: 44.0, text: "Baby, it could be, yeah" },
            { time: 45.5, text: "Where we don't turn off the lights" },
            { time: 49.0, text: "Wanna see your body on mine..." }
        ];
        let lastText = 0;
        button.addEventListener("click",()=>{
            if(song.paused){
                song.play();
                button.textContent = "Stop";
            }else{
                song.pause();
                button.textContent = "Play";
            }
        });
        song.addEventListener("timeupdate", () => {
            let text = "";
            for (const line of lyrics) {
                if (song.currentTime >= line.time) {
                    text = line.text;
                }
            }
            if (text !== lastText) {
                lastText = text;
                lyricsBox.innerHTML = `<div class="fade">${text}</div>`;
            }
        });
        song.addEventListener("ended", () => {
            button.textContent = "You get...";
        });
        setInterval(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.textContent = "❤︎";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = 14 + Math.random() * 35 + "px";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }, 600);
    </script>
</body>

</html>
