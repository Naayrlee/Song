<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รักให้เธอได้รู้</title>
    <style>
        body{
        background: #101010;
        color: white;
        font-family: monospace;
        text-align: center;
        padding: 24px;
        }
        h1{color: #d8a4ff;}
        button{
        padding: 12px 25px;
        background: #d8a4ff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        }
        #lyrics {
        margin-top: 40px;
        font-size: 24px;
        min-height: 60px;
    }
        .fade{animation:fadeIn 1s;}
        @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
        .heart {
            position: fixed;
            bottom: -30px;
            color: #d8a4ff;
            opacity: 0.5;
            animation: floatUp 6s linear forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            to {transform: translateY(-110vh); opacity: 0;}
        }
    </style>
</head>

<body>
    <h1>Song For You ♡</h1>
    <p>เพลงนี้อยากให้เธอลองฟัง...</p>
    <button id="PlayButton">เล่นเพลง</button>
    <audio id="Song" src="https://naayrlee.github.io/Song/%E0%B8%A3%E0%B8%B1%E0%B8%81%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%98%E0%B8%AD%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%A3%E0%B8%B9%E0%B9%89%E0%B9%80%E0%B8%99%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B9%80%E0%B8%9E%E0%B8%A5%E0%B8%87.mp4"></audio>
    <div id="lyrics"></div>
    <script>
        const song = document.getElementById("Song");
        const button = document.getElementById("PlayButton");
        const lyricsBox = document.getElementById("lyrics");
        const lyrics = [
            { time: 0.5, text: "แค่อยากให้เธอรู้" },
            { time: 2.5, text: "ความรักมันเป็นอย่างไร" },
            { time: 4.5, text: "ให้เธอมองทางนี้" },
            { time: 6, text: "baby look into my eyes" },
            { time: 8.5, text: "Baby come get your love" },
            { time: 10.5, text: "ให้ฉัน get you the world" },
            { time: 12.5, text: "โลกที่เหมือนฝันละเมอ" },
            { time: 14.5, text: "โลกที่เธอไม่คิดว่าจะได้เจอ..." },
            { time: 18, text: "ถ้าเธอยังสงสัยว่า" },
            { time: 20, text: "ความรักหน้าตาเป็นไง" },
            { time: 22.5, text: "ก่อนที่เธอจะไป" },
            { time: 24.5, text: "ขอให้มันเป็นฉันได้ไหม" },
            { time: 26.5, text: "คนที่รักเธอและ" },
            { time: 28, text: "คนที่เธอเปิด" },
            { time: 30.5, text: "ให้ฉันรักให้เธอได้รู้..." },
            { time: 33.5, text: "ไม่รู้ว่าจะชอบไหม..." },
            { time: 35, text: "...แต่..." },
            { time: 37, text: "อยากทำให้ชอบมากกว่า ♡" },
            { time: 39, text: "===== ♡ =====" }
        ];
        let lastText = 0;
        button.addEventListener("click",()=>{
            if(song.paused){
                song.play();
                button.textContent = "หยุดชั่วคราว...";
            }else{
                song.pause();
                button.textContent = "เล่นเพลง";
            }
        });
        song.addEventListener("timeupdate", () => {
            let text = "";
            for (const line of lyrics) {
                if (song.currentTime >= line.time) {
                    text = line.text;
                }
            }
            if (text !== lastText) {
                lastText = text;
                lyricsBox.innerHTML = `<div class="fade">${text}</div>`;
            }
        });
        song.addEventListener("ended", () => {
            button.textContent = "ชอบไหมครับ♡";
        });
        setInterval(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.textContent = "♡";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = 14 + Math.random() * 30 + "px";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 600);
    </script>
</body>

</html>
